name: PR title

on:
  pull_request_target:
    types: [opened, edited, synchronize, reopened, ready_for_review]

# Read PR metadata only. Never check out or execute the contributor's code here.
permissions: {}

jobs:
  title:
    name: PR title
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Check title format
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys

          pattern = r"(feat|feature|fix|docs|refactor|perf|test|build|ci|chore|revert)(\([a-z0-9][a-z0-9-]*\))?!?: [A-Z](?:[^\r\n]*\S)?"
          if not re.fullmatch(pattern, os.environ["PR_TITLE"]):
              sys.exit(
                  "Use type(scope): Description, for example feat(journeys): Adds route planning. "
                  "Scope is optional; start the description with a capital letter. "
                  "Types: feat, feature, fix, docs, refactor, perf, test, build, ci, chore, revert. "
                  "Put ! before the colon for a breaking change. See CONTRIBUTING.md."
              )
          PY
