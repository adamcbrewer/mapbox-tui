name: Bug report
description: Report something that doesn't work as expected.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: See our [contribution guide](https://github.com/adamcbrewer/mapbox-tui/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: reproduction
    attributes:
      label: Steps to reproduce
      description: Include the command or keyboard actions needed to reproduce the bug.
    validations:
      required: true
  - type: textarea
    id: behaviour
    attributes:
      label: Expected and actual behaviour
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include your mapbox-tui version or commit, OS, terminal, and whether Mapbox is involved.
    validations:
      required: true
  - type: textarea
    id: attachments
    attributes:
      label: Logs, captures or sample files (optional)
      description: Use synthetic or minimised files. Remove credentials and personal location data before uploading.
